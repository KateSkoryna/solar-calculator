<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team and activity, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;color:#16231B;background:#F6F4EE}
a{color:inherit}
.swap{animation:swap .3s cubic-bezier(.2,.7,.2,1) both;@media (prefers-reduced-motion:reduce){animation:none}}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; background: #F6F4EE; display: flex; flex-direction: column">

<header style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #4F5F55">Nordwind Logistics · <span style="font-weight: 600">Sample data</span></span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Team &amp; activity</h1>
</div>
<div role="tablist" aria-label="Section" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 999px; background: #E9ECE4">
<button type="button" role="tab" aria-selected="{{activitySelected}}" onClick="{{showActivity}}" style="{{activityTabStyle}}">Activity</button>
<button type="button" role="tab" aria-selected="{{teamSelected}}" onClick="{{showTeam}}" style="{{teamTabStyle}}">Team · 4</button>
</div>
</header>

<main style="padding: 16px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{isActivity}}" hint-placeholder-val="{{true}}">
<div class="swap" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 8px; overflow: hidden">
<button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; flex-shrink: 0; border-radius: 999px; border: 1px solid #16231B; background: #16231B; color: #F6F4EE; font: 600 14px 'Instrument Sans', sans-serif">Everything</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; flex-shrink: 0; border-radius: 999px; border: 1px solid #DEE3DA; background: #FFFFFF; color: #16231B; font: 600 14px 'Instrument Sans', sans-serif">Vehicles</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; flex-shrink: 0; border-radius: 999px; border: 1px solid #DEE3DA; background: #FFFFFF; color: #16231B; font: 600 14px 'Instrument Sans', sans-serif">Calculations</button>
</div>
<sc-for list="{{events}}" as="event" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #DEE3DA; border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: flex-start">
<span style="width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #F6F4EE">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16231B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{event.icon}}"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; line-height: 1.45"><span style="font-weight: 600">{{event.who}}</span> {{event.what}}</span>
<span style="font-size: 13px; color: #4F5F55">{{event.when}}</span>
</span>
</div>
</sc-for>
<button type="button" style="height: 48px; border-radius: 999px; border: 1px solid #C9D2C6; background: transparent; font: 600 15px 'Instrument Sans', sans-serif; color: #16231B">Show older</button>
</div>
</sc-if>

<sc-if value="{{isTeam}}" hint-placeholder-val="{{false}}">
<div class="swap" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{members}}" as="member" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #DEE3DA; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: #F6F4EE; border: 1px solid #DEE3DA">{{member.initials}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 600">{{member.name}}</span><span style="font-size: 13px; color: #4F5F55">{{member.email}}</span></span>
<span style="{{member.roleStyle}}">{{member.role}}</span>
</div>
</sc-for>
<p style="margin: 4px 0; font-size: 13px; line-height: 1.6; color: #4F5F55"><span style="font-weight: 600; color: #16231B">Owner</span> — everything. <span style="font-weight: 600; color: #16231B">Manager</span> — add vehicles, run calculations. <span style="font-weight: 600; color: #16231B">Viewer</span> — look only.</p>
<button type="button" style="height: 54px; border-radius: 999px; border: 0; background: #B6F065; color: #16231B; font: 600 16px 'Instrument Sans', sans-serif">Invite someone</button>
</div>
</sc-if>
</main>

<nav aria-label="Main" style="margin-top: auto; height: 76px; box-sizing: border-box; padding: 8px 8px 12px; border-top: 1px solid #DEE3DA; background: #FFFFFF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
<a href="{{tab.href}}" style="{{tab.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{tab.icon}}"></path></svg>
<span style="font-size: 12px; font-weight: 600">{{tab.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { section: 'activity' };
}
renderVals() {
const isActivity = this.state.section === 'activity';
const segment = (active) => 'height: 44px; border-radius: 999px; border: 0; font: 600 15px \'Instrument Sans\', sans-serif; cursor: pointer; ' + (active ? 'background: #FFFFFF; color: #16231B; box-shadow: 0 1px 3px rgba(22,35,27,.12);' : 'background: transparent; color: #4F5F55;');
const tab = (label, icon, href, active) => ({ label, icon, href, style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; border-radius: 12px; color: ' + (active ? '#16231B' : '#5A6A60') + (active ? '; background: #E9F5D6' : '') });
const tabs = [
tab('Overview', 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z', 'DashboardMobile.dc.html', false),
tab('Vehicles', 'M2 16V8h11l4 3h4v5H2z', '#', false),
tab('Results', 'M5 3h14v18H5zM9 7h6M9 11h6M9 15h3', '#', false),
tab('Team', 'M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7', 'TeamMobile.dc.html', true)
];
const roleColors = { Owner: ['#16231B', '#F6F4EE'], Manager: ['#E9F5D6', '#2F5A1E'], Viewer: ['#EEF1EA', '#4F5F55'] };
const members = [
{ name: 'Anna Weber', email: 'anna@nordwind.example', role: 'Owner' },
{ name: 'Jonas Keller', email: 'jonas@nordwind.example', role: 'Manager' },
{ name: 'Mira Hoffmann', email: 'mira@nordwind.example', role: 'Manager' },
{ name: 'Tom Braun', email: 'tom@nordwind.example', role: 'Viewer' }
].map((m) => ({
...m,
initials: m.name.split(' ').map((p) => p[0]).join(''),
roleStyle: 'height: 26px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; background: ' + roleColors[m.role][0] + '; color: ' + roleColors[m.role][1]
}));
const icons = { vehicle: 'M2 16V8h11l4 3h4v5H2z', calculation: 'M5 3h14v18H5zM9 7h6M9 11h6M9 15h3', team: 'M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7M2.5 20a6.5 6.5 0 0 1 13 0' };
const events = [
{ kind: 'calculation', who: 'Jonas', what: 'recalculated Mercedes Sprinter ×10 — payback now 4 yrs 4 mo (was 4 yrs 7 mo)', when: 'Today, 09:42' },
{ kind: 'vehicle', who: 'Anna', what: 'added Solaris Urbino 12 ×4 in Leipzig', when: 'Yesterday, 16:10' },
{ kind: 'team', who: 'Anna', what: 'changed Tom from Manager to Viewer', when: 'Yesterday, 11:03' },
{ kind: 'vehicle', who: 'Mira', what: 'changed daily distance for Scania R450 from 180 km to 220 km', when: '27 Sep, 14:55' },
{ kind: 'calculation', who: 'Mira', what: 'ran a new calculation for Scania R450 ×6', when: '27 Sep, 14:58' }
].map((e) => ({ ...e, icon: icons[e.kind] }));
return {
tabs, members, events,
isActivity,
isTeam: !isActivity,
activitySelected: String(isActivity),
teamSelected: String(!isActivity),
activityTabStyle: segment(isActivity),
teamTabStyle: segment(!isActivity),
showActivity: () => this.setState({ section: 'activity' }),
showTeam: () => this.setState({ section: 'team' })
};
}
}
</script>
</body>
</html>
