<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Log in · mobile · Daylight design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;color:#16231B;background:#F6F4EE}
a{color:#2F5A1E}a:hover{color:#1F3A2B}
.field{transition:border-color .15s ease,box-shadow .15s ease;&:focus{outline:none;border-color:#16231B;box-shadow:0 0 0 4px #E9F5D6}}
</style>
</head><body>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EE; display: flex; flex-direction: column; padding: 16px 16px 24px; gap: 20px">
<header style="height: 44px; display: flex; align-items: center; justify-content: space-between">
<a href="HomeMobile.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #16231B; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">
<svg width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="#1F3A2B" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="#B6F065"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
Solar Calculator
</a>
<a href="HomeMobile.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #DEE3DA; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="#16231B" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</header>
<div role="tablist" aria-label="Account" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 999px; background: #E9ECE4">
<button type="button" role="tab" aria-selected="true" style="height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; color: #16231B; font: 600 15px 'Instrument Sans', sans-serif; box-shadow: 0 1px 3px rgba(22,35,27,.12)">Log in</button>
<button type="button" role="tab" aria-selected="false" style="height: 44px; border-radius: 999px; border: 0; background: transparent; color: #4F5F55; font: 600 15px 'Instrument Sans', sans-serif">Create account</button>
</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Welcome back</h1>
<button type="button" style="height: 54px; border-radius: 16px; border: 1px solid #C9D2C6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 12px; font: 600 16px 'Instrument Sans', sans-serif; color: #16231B">
<svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="#16231B" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 12h8"></path></svg>
Continue with Google</button>
<div style="display: flex; align-items: center; gap: 12px; font-size: 14px; color: #5A6A60"><span style="flex-grow: 1; height: 1px; background: #DEE3DA"></span>or with email<span style="flex-grow: 1; height: 1px; background: #DEE3DA"></span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="lm-email" style="font-size: 15px; font-weight: 600">Email</label>
<input id="lm-email" class="field" type="email" placeholder="you@company.com" style="height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1px solid #C9D2C6; background: #FFFFFF; font: 16px 'Instrument Sans', sans-serif; color: #16231B">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><label for="lm-password" style="font-size: 15px; font-weight: 600">Password</label><a href="#" style="font-size: 14px; font-weight: 600">Forgot it?</a></div>
<input id="lm-password" class="field" type="password" style="height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1px solid #C9D2C6; background: #FFFFFF; font: 16px 'Instrument Sans', sans-serif; color: #16231B">
</div>
<a href="DashboardMobile.html" style="margin-top: auto; height: 56px; border-radius: 999px; background: #16231B; color: #F6F4EE; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 17px">Log in</a>
</div>
</body></html>
